   <div class="kpi"><span class="lbl">Avance</span><span class="num">${pct==null||!planInfo().k||planInfo().fut?"—":pct+"%"}</span></div>${(()=>{const pb=pubOf(S.month);return `<div class="kpi" title="${esc(pb.parts.map(([k,n])=>chLabel(k)+" "+n).join(" · "))} (cada pieza se cuenta una vez)"><span class="lbl">Publicados este mes</span><span class="num">${pb.max}</span></div><div class="kpi"><span class="lbl">En la parrilla</span><span class="num">${monthPosts.length}</span></div>`})()}
   <div class="row"><button class="btn accent" data-act="genPlan" ${S.sample&&!S.sampleOff&&S.canWrite&&!S.planRun.running?"":"disabled"}>${ic("spark")} ${S.plan?.objectives?.length?"Rehacer plan con IA":"Crear plan con IA"}</button><button class="btn" data-act="view" data-v="invest">Números e inversión</button><button class="btn round" data-act="month" data-n="-1" aria-label="Mes anterior">${ic("left")}</button><button class="btn round" data-act="month" data-n="1" aria-label="Mes siguiente">${ic("right")}</button></div></section>
   ${S.planRun.running?`<div class="thinkrow thinking">${loopSvg()} Armando el plan con tendencias, competencia, audiencia y números…</div>`:""}${S.planRun.error?`<p class="hint" style="color:var(--bad)">${esc(S.planRun.error)}</p>`:""}
   ${(()=>{const f=finOf(),k=finCalc(f);return k.budget?`<article class="panel"><div class="ph"><div class="t"><h2>Inversión del mes</h2><span class="s">${esc(money(k.budget,f.currency))} · ${f.mktPct}% de la facturación${k.acq!=null?" · alcanza para unos "+k.acq+" clientes nuevos":""}</span></div></div><div class="inner" style="display:flex;flex-direction:column;gap:10px">${ALLOC.map(([a,l])=>`<div class="obj"><div class="top2"><b>${l}</b><span class="pct">${esc(money(k.amt(a),f.currency))}</span></div><div class="bar"><i style="width:${Math.round((Number(f.alloc[a])||0)/k.totA*100)}%"></i></div></div>`).join("")}</div></article>`:""})()}
   <section class="home" style="--cols:minmax(0,1fr) minmax(280px,360px)">
   <article class="panel"><div class="ph"><div class="t"><h2>Objetivos y KPIs</h2><span class="s">Mueve el avance cuando tengas resultados</span></div></div>
    <div class="inner" style="display:flex;flex-direction:column;gap:18px">${o.length?o.map(x=>{const p=Math.max(0,Math.min(100,objPct(x)));const au=objAuto(x)!=null;return `<div class="obj"><div class="top2"><b>${esc(x.text)}</b><span class="pct">${p}%${au?'<small class="autob" title="Se calcula solo con los datos de Brandloop">auto</small>':""}</span>${S.canWrite?`<button class="x" data-act="delObj" data-id="${esc(x.id)}" aria-label="Quitar objetivo">${ic("x")}</button>`:""}</div>
     ${S.canWrite?`<input type="range" min="0" max="100" step="5" value="${p}" id="rg-${esc(x.id)}" data-act-change="objProg" data-id="${esc(x.id)}" aria-label="Avance de ${esc(x.text)}">`:`<div class="bar"><i style="width:${p}%"></i></div>`}
     <span class="meta">${esc(x.kpi||"Sin KPI")}${x.target?" · meta: "+esc(x.target):""}${(()=>{const ms=objMeasure(x);return ms?` · llevamos <b>${esc(ms.v.toLocaleString("es-GT"))}</b> (${esc(ms.how)})`:(Number(x.progress)||0)>0?" · avance puesto a mano":" · sin dato automático: mueve la barra cuando tengas el resultado"})()}</span></div>`}).join(""):`<p class="hint">Aún no hay objetivos para ${esc(monthLabel(S.month))}. Agrega el primero abajo.</p>`}
    ${S.canWrite?`<form class="row" data-form="obj" style="border-top:1px solid var(--line);padding-top:14px"><div class="field" style="flex:2 1 220px"><label for="ob-text">Objetivo</label><input type="text" id="ob-text" data-draft="ob-text" placeholder="Ej. Generar demos desde LinkedIn"></div><div class="field"><label for="ob-kpi">KPI</label><input type="text" id="ob-kpi" data-draft="ob-kpi" placeholder="Ej. Demos agendadas"></div><div class="field"><label for="ob-target">Meta</label><input type="text" id="ob-target" data-draft="ob-target" placeholder="Ej. 10"></div><button class="btn ink">Agregar</button></form>`:""}</div></article>
   <div class="stack"><article class="panel"><div class="ph"><div class="t"><h2>Enfoque del mes</h2></div></div>
    ${S.canWrite?`<form data-form="focus" style="display:flex;flex-direction:column;gap:10px"><textarea id="pl-focus" data-draft="pl-focus-${esc(S.month)}" placeholder="La idea central del mes">${esc(S.plan?.focus||"")}</textarea><button class="btn ink" style="align-self:flex-start">Guardar enfoque</button></form>`:`<div class="inner"><p>${esc(S.plan?.focus||"Sin enfoque definido.")}</p></div>`}</article>
    <article class="panel"><div class="ph"><div class="t"><h2>Mezcla de canales</h2><span class="s">Publicado y programado este mes, por canal</span></div></div><div class="inner" style="display:flex;flex-direction:column;gap:10px">${(()=>{const pb=pubOf(S.month);const rows=CHANNELS.map(ch=>{const pub=pb.ch[ch]||0;const prog=monthPosts.filter(p=>p.channel===ch&&p.status!=="published").length;return [ch,pub,prog]}).filter(r=>r[1]+r[2]).sort((a,b)=>(b[1]+b[2])-(a[1]+a[2]));const mx=Math.max(1,...rows.map(r=>r[1]+r[2]));return rows.length?rows.map(([ch,pub,prog])=>`<div class="obj"><div class="top2"><b style="display:flex;gap:8px;align-items:center;${chVar(ch)}"><i class="dot"></i>${esc(chLabel(ch))}</b><span class="pct">${pub+prog}</span></div><div class="bar mixbar"><i style="width:${Math.round(pub/mx*100)}%"></i><i class="prog" style="width:${Math.round(prog/mx*100)}%"></i></div><span class="hint" style="font-size:11.5px">${pub} publicado${pub===1?"":"s"}${prog?" · "+prog+" programado"+(prog===1?"":"s"):""}</span></div>`).join(""):`<p class="hint">Todavía no hay publicaciones este mes.</p>`})()}</div></article></div>
   </section>
   ${planExtras()}`;
}

  C.use("downloads").then(d=>{S.dl=d;render()});
  C.use("assets").then(a=>{S.assets=a;render()});
  C.use("mcp").then(async m=>{S.mcp=m;if(m){try{const st=await claude.use("permissions");}catch(e){}S.gdrive=true}render()});
  C.use("sample").then(async s=>{S.sample=s;if(s){try{const l=await s.limits();S.tools=!!l?.tools}catch(e){}}render()});
})();
/* importaciones privadas (data/users/<yo>) → datos cifrados de la marca */
async function runImports(){
  if(S.impRun||!S.me?.id||!S.cid||!S.cwBase)return;S.impRun=true;
  try{const snap=await S.db.collection("data/users/"+S.me.id).get();
    for(const d of snap.docs){const v=d.data()||{};
      if(v.kind==="clientNew"&&v.id&&v.data?.name){if(!V.M&&V.enabled)continue;const id=String(v.id);const del=async()=>{try{await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete()}catch(e){}};
        const exists=S.clients.some(c=>c.id===id);if(exists&&V.keys?.[id]&&!v.user){await del();continue}
        try{if(!V.keys?.[id])await vaultNewBrand(id);const ok=await write(()=>exists?S.db.doc("clients/"+id).set({...(({id:_x,...r})=>r)(S.clients.find(c=>c.id===id)||{}),...v.data,updatedAt:Date.now()}):S.db.doc("clients/"+id).set({...v.data,order:S.clients.length+1,createdAt:Date.now()}));if(ok!==false){await del();autoOn(id);let cred=null;
          if(V.user?.role==="admin"){try{const vs=await S.rawdb.collection("vault_users").get();const us=vs.docs.map(x=>({uname:x.id,...x.data()}));if(!us.some(u=>u.role!=="admin"&&(u.brands||[]).includes(id))){const base=unameOf(v.user?.uname||String(v.data.name).split(/\s+/)[0])||unameOf(id);let un=base,k=2;while(us.some(u=>u.uname===un)){un=base+k;k++}const pass=(v.user?.pass&&String(v.user.pass).length>=10)?String(v.user.pass):genPass();await vaultCreateUser({name:v.data.name,uname:un,pass,role:"member",brands:[id]});cred={brand:v.data.name,uname:un,pass};S.newCreds=[...(S.newCreds||[]),cred]}}catch(e){}
            S.view="access";S.vusers=null;loadVaultUsers()}
          toast(cred?`${v.data.name} ya está en Brandloop y su usuario está creado. Copia la contraseña.`:`${v.data.name} ya está en Brandloop.`);render()}}catch(e){toast("No se pudo crear "+v.data.name)}continue}
      if(v.cid!==S.cid)continue;
      if(v.kind==="campaign"&&v.docId&&v.data){try{await write(()=>col("campaigns").doc(String(v.docId)).set({...v.data,createdAt:v.data.createdAt||Date.now(),createdBy:myId()}));await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();toast("Campaña agregada: "+(v.data.name||""))}catch(e){}continue}
      if(v.kind==="personPatch"&&v.data){const pr=S.people.find(x=>norm(x.name)===norm(v.name));if(!pr)continue;try{const {id,...cur}=pr;await write(()=>col("people").doc(pr.id).set({...cur,...v.data,updatedAt:Date.now()}));await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();toast("Perfil de "+pr.name+" actualizado")}catch(e){}continue}
      if(v.kind==="planPatch"&&v.month&&v.data){try{const ref=S.db.doc(`clients/${S.cid}/plan/${v.month}`);const snap=await ref.get();const cur=snap.exists?(snap.data()||{}):{};const x=v.data;const nx={...cur};
        if(x.focusAppend&&!(cur.focus||"").includes(x.focusAppend))nx.focus=((cur.focus||"").trim()+" "+x.focusAppend).trim();
        if(Array.isArray(x.objectivesAdd)){const o=[...(cur.objectives||[])];for(const ob of x.objectivesAdd)if(!o.some(z=>z.text===ob.text))o.push({id:rid(),progress:0,...ob});nx.objectives=o}
        if(Array.isArray(x.weeksAdd)){const w=(cur.weeks||[]).map(z=>({...z,actions:[...(z.actions||[])]}));x.weeksAdd.forEach((wk,i)=>{const t=w.find(z=>z.name===wk.name)||w[i];if(t){for(const a of wk.actions)if(!t.actions.includes(a))t.actions.push(a)}else w.push({name:wk.name,actions:wk.actions})});nx.weeks=w}
        const ok=await write(()=>ref.set({...nx,updatedAt:Date.now()}));if(ok!==false){await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();toast("Plan de "+monthLabel(v.month)+" actualizado")}}catch(e){}continue}
      if(v.kind==="orderFirst"&&Array.isArray(v.titles)&&v.start){if(!S.postsSeen){if(!S.impRetry3){S.impRetry3=1;setTimeout(()=>{S.impRetry3=0;runImports()},4000)}continue}
        const nz=x=>norm(String(x||""));const pool=S.posts.filter(p=>!p.campaign&&p.status!=="published");const first=[];
        for(const t of v.titles){const hit=pool.find(p=>!first.includes(p)&&nz(p.title).includes(nz(t)));if(hit)first.push(hit)}
        const rest=pool.filter(p=>!first.includes(p)).sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999"))||(a.createdAt||0)-(b.createdAt||0));
        const dows=Array.isArray(v.dows)?v.dows:[1,2,3,4];const dt=new Date(v.start+"T12:00:00");let n=0;
        for(const p of [...first,...rest]){while(!dows.includes(dt.getDay()))dt.setDate(dt.getDate()+1);const ds=dt.toISOString().slice(0,10);dt.setDate(dt.getDate()+1);if(p.date!==ds){try{await col("posts").doc(p.id).update({date:ds,prevDate:p.date||""});n++}catch(e){}}}
        try{await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete()}catch(e){}toast(`Parrilla reordenada: ${first.length} piezas primero (${first.map(p=>p.title).join(", ").slice(0,80)}…)`);render();continue}
      if(v.kind==="postsPatch"&&Array.isArray(v.items)){if(!S.postsSeen)continue;let n=0;for(const it of v.items){const cur=S.posts.find(p=>p.id===it.id);if(!cur)continue;try{await col("posts").doc(String(it.id)).update(it.data||{});n++}catch(e){}}if(n===v.items.length){try{await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete()}catch(e){}}continue}
      if(v.kind==="postsAdd"&&Array.isArray(v.items)){if(!S.postsSeen){if(!S.impRetry2){S.impRetry2=1;setTimeout(()=>{S.impRetry2=0;runImports()},4000)}continue}let n=0;const taken=new Set(S.posts.filter(p=>!p.campaign&&p.date).map(p=>p.date));const dws=Array.isArray(v.dows)?v.dows:[1,2,3,4];const td=new Date();td.setDate(td.getDate()+1);const st=v.start&&v.start>td.toISOString().slice(0,10)?new Date(v.start+"T12:00:00"):new Date(td.toISOString().slice(0,10)+"T12:00:00");
        const nextFree=()=>{for(let i=0;i<400;i++){const ds=st.toISOString().slice(0,10);const ok=dws.includes(st.getDay())&&!taken.has(ds);st.setDate(st.getDate()+1);if(ok){taken.add(ds);return ds}}return ""};
        for(const it0 of v.items){if(!it0||!it0.id)continue;if(S.posts.some(p=>p.id===it0.id)){n++;continue}const it={...it0};if(v.autoDate&&!it.date)it.date=nextFree();const {id,...rest}=it;try{await col("posts").doc(String(id)).set({...rest,createdAt:Date.now(),createdBy:myId()});n++}catch(e){}}if(n===v.items.length){try{await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete()}catch(e){}}toast(`${v.label||"Piezas"}: ${n} piezas en la parrilla`);continue}
      if(v.kind==="distribute"&&v.start){if(!S.postsSeen){if(!S.impRetry){S.impRetry=1;setTimeout(()=>{S.impRetry=0;runImports()},4000)}continue}try{await applyDistribute(String(v.start),Array.isArray(v.dows)?v.dows:[1,2,3,4]);await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();S.month=String(v.start).slice(0,7);render()}catch(e){}continue}
      if(v.kind==="clientPatch"&&v.data){try{const ok=await write(()=>S.db.doc("clients/"+S.cid).update({...v.data,updatedAt:Date.now()}));if(ok!==false){await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();toast("Perfil de marca actualizado")}}catch(e){}continue}
      if(v.kind==="emailcamp"&&v.docId&&v.data){try{await col("emailcamps").doc(String(v.docId)).set({...v.data,updatedAt:Date.now()});await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete();toast("Campaña de email agregada a Campañas y eventos")}catch(e){}continue}
      const target=v.kind==="deals"&&Array.isArray(v.items)?"deals":null;if(!target)continue;let n=0;
      for(const it of v.items){if(!it||!it.id)continue;const {id,...rest}=it;try{await col(target).doc(String(id)).set({...rest,createdAt:rest.createdAt||Date.now(),updatedAt:Date.now(),createdBy:myId()});n++}catch(e){}}
      if(n===v.items.length){try{await S.db.doc("data/users/"+S.me.id+"/"+d.id).delete()}catch(e){}}
      if(n)toast(`Se importaron ${n} oportunidades${v.label?" de "+v.label:""}`);
    }
  }catch(e){}finally{S.impRun=false}
}
function startData(){
  if(S.clientsUnsub){try{S.clientsUnsub()}catch(e){}}
  S.clientsUnsub=S.db.collection("clients").orderBy("order").onSnapshot(s=>{
    S.clients=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!V.enabled||V.keys[c.id]);S.clientsLoaded=true;if(V.user&&!S.inboxDone&&!S.inboxRun)setTimeout(()=>importDesignInbox().catch(()=>{S.inboxRun=false}),800);if(!S.inboxTick){const tick=()=>{if(V.user&&!S.inboxRun&&document.visibilityState==="visible")importDesignInbox().catch(()=>{S.inboxRun=false})};S.inboxTick=setInterval(tick,45000);document.addEventListener("visibilitychange",tick);window.addEventListener("focus",tick)}
    if(!S.cid||!S.clients.some(c=>c.id===S.cid)){const saved=lsGet("bl-client");const pick=S.clients.find(c=>c.id===saved)||S.clients[0];if(pick)selectClient(pick.id)}
    render();
  },e=>{dbErr(e);S.clientsLoaded=true;render()});
}
